services:
  - type: web
    name: transactflow-riskai
    runtime: python
    rootDir: RiskAI
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROUP_ID
        value: GRP-001
      - key: GROUP_NAME
        value: Sunrise Chit Fund
      - key: MONTHLY_CONTRIBUTION
        value: "5000"
      - key: CHIT_VALUE
        value: "100000"
      - key: GROUP_START_DATE
        value: "2024-01-01"
      - key: TOTAL_CYCLES
        value: "20"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false   # set manually in Render dashboard (paste your serviceAccountKey.json content)
